services:
  api:
    build:
      target: dev
    command:
      - sh
      - -c
      - pnpm --filter @ia-dashboard/api db:migrate && pnpm --filter @ia-dashboard/api start:dev
    networks:
      - private
      - proxy
    environment:
      OPENCODE_DB_PATH: /opencode/opencode.db
      OPENCODE_VM_STORE_DIR: /opencode-vm
      CI: "true"
    volumes:
      - ./api:/app/api
      - ${OPENCODE_DATA_DIR:-${HOME}/.local/share/opencode}:/opencode:ro
      - ${OPENCODE_VM_STORE_DIR:-${HOME}/.local/share/opencode-vm}:/opencode-vm:ro
    labels:
      caddy: http://api.ia-dashboard.localhost
      caddy.reverse_proxy: "{{upstreams 3000}}"

  webapp:
    build:
      target: dev
    networks:
      - private
      - proxy
    environment:
      VITE_API_PROXY: http://api:3000
      CI: "true"
    volumes:
      - ./webapp:/app/webapp
    labels:
      caddy: http://ia-dashboard.localhost
      caddy.reverse_proxy: "{{upstreams 5173}}"

networks:
  proxy:
    external: true
    name: local-proxy
