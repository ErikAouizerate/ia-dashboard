services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - private
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ia}
      POSTGRES_DB: ${POSTGRES_DB:-ia_dashboard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ia} -d ${POSTGRES_DB:-ia_dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    networks:
      - private
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ia}:${POSTGRES_PASSWORD:-ia}@db:5432/${POSTGRES_DB:-ia_dashboard}
      OPENCODE_DB_PATH: /opencode/opencode.db
      OPENCODE_AUTH_PATH: /opencode/auth.json
      OPENCODE_VM_STORE_DIR: /opencode-vm
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
    volumes:
      - ${OPENCODE_DATA_DIR:-${HOME}/.local/share/opencode}:/opencode:ro
      - ${OPENCODE_VM_STORE_DIR:-${HOME}/.local/share/opencode-vm}:/opencode-vm:ro
    depends_on:
      db:
        condition: service_healthy

  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    networks:
      - private
    expose:
      - "5173"
    depends_on:
      - api

volumes:
  pgdata:

networks:
  private:
    name: ia-dashboard-private
